<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>My Image Gallery</h1>

    <!-- Category Buttons -->
    <div class="filters">
        <button class="filter-btn active" data-category="all">All</button>
        <button class="filter-btn" data-category="nature">Nature</button>
        <button class="filter-btn" data-category="city">City</button>
        <button class="filter-btn" data-category="animals">Animals</button>
    </div>

    <!-- Gallery -->
    <div class="gallery">

        <div class="gallery-item" data-category="nature">
            <img src="https://picsum.photos/id/10/600/400" alt="Nature">
        </div>

        <div class="gallery-item" data-category="city">
            <img src="https://picsum.photos/id/20/600/400" alt="City">
        </div>

        <div class="gallery-item" data-category="animals">
            <img src="https://picsum.photos/id/237/600/400" alt="Animal">
        </div>

        <div class="gallery-item" data-category="nature">
            <img src="https://picsum.photos/id/29/600/400" alt="Nature">
        </div>

        <div class="gallery-item" data-category="city">
            <img src="https://picsum.photos/id/30/600/400" alt="City">
        </div>

        <div class="gallery-item" data-category="animals">
            <img src="https://picsum.photos/id/40/600/400" alt="Animal">
        </div>

    </div>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox">

        <span class="close">&times;</span>

        <button class="prev">&#10094;</button>

        <img id="lightbox-img" src="" alt="Preview">

        <button class="next">&#10095;</button>

    </div>

    <script src="script.js"></script>

</body>
</html>
